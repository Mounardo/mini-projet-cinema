<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recherche de films</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <header>
        <nav>
    <a href="index.html" class="logo"><b>Ciné Green</b></a>

    <div class="nav-links">
        <a href="index.html">Accueil</a>
        <a href="search.html">Rechercher</a>
    </div>
</nav>
    </header>

    <main>
        <h1>Rechercher un film</h1>
        <div class="search-box">
    <span class="search-icon">⌕</span>

    <input
        type="search"
        id="search-input"
        placeholder="Rechercher un film..."
    >
</div>
<section>
    <h2>Résultats</h2>

    <div id="search-results">
    </div>
    <button id="load-more-search" type="button" hidden>
    Charger plus de résultats
</button>
</section>
    </main>
    <footer>
    <div class="footer-content">
        <a href="index.html" class="footer-logo">Ciné Green</a>

        <p>
            Découvrez, recherchez et explorez vos films préférés.
        </p>

        <p class="footer-credit">
            Données fournies par OMDb API
        </p>
    </div>
</footer>
    <script type="module" src="./js/search.js"></script>
</body>
</html>
